<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四子棋（坐标落子版）</title>
<style>
*{box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f1efe9;color:#333;margin:0;padding:32px 16px;line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #ecebe6;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);padding:30px 30px 26px;}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start;}
.layout-left{display:flex;flex-direction:column;align-items:center;min-width:0;}
.layout-right{display:flex;flex-direction:column;gap:14px;min-width:0;}
@media (max-width:920px){
  .layout{grid-template-columns:1fr;}
  .layout-left{margin-bottom:6px;}
}
.logo{display:flex;gap:7px;justify-content:center;margin-bottom:12px;}
.lg{width:15px;height:15px;border-radius:50%;}
.lg.b{background:radial-gradient(circle at 35% 30%,#5a5a5a,#000 70%);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.lg.w{background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc 75%);border:1px solid #c4c4c4;box-shadow:0 1px 2px rgba(0,0,0,.15);}
h1{font-size:25px;text-align:center;margin:0 0 4px;color:#1c1c1e;letter-spacing:1px;}
.sub{text-align:center;color:#8a887f;font-size:14px;margin:0 0 20px;}
svg.board{display:block;margin:0 auto;max-width:640px;width:100%;height:auto;background:#f1e3c0;border:1px solid #a87f3e;border-radius:10px;}
.gl{stroke:#b8945c;stroke-width:1;}
.ax{stroke:#333;stroke-width:2;}
.lab{font-size:12px;fill:#777;}
.axname{font-size:15px;font-weight:bold;font-style:italic;fill:#333;}
.pc.black{fill:url(#gBlack);}
.pc.white{fill:url(#gWhite);stroke:#c0c0c0;stroke-width:1;}
.ring{fill:none;stroke:#e5484d;stroke-width:2.5;}
/* ---- 联机条 ---- */
.net{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px;}
.net-tag{font-size:12px;letter-spacing:1px;color:#8a887f;background:#f4f3ef;border:1px solid #e3e1da;border-radius:999px;padding:4px 12px;font-weight:600;}
.net input{height:40px;width:200px;padding:0 13px;border:1px solid #d5d3cb;border-radius:10px;font-size:14px;color:#333;outline:none;transition:border-color .15s,box-shadow .15s;}
.net input::placeholder{color:#b3b1a8;}
.net input:focus{border-color:#4c52d6;box-shadow:0 0 0 3px rgba(76,82,214,.14);}
.net input:disabled{background:#f4f3ef;color:#8a887f;}
.net .btn{height:40px;padding:0 18px;border-radius:10px;font-size:14px;}
.net-status{text-align:center;font-size:12.5px;color:#9a988e;margin:10px 0 0;min-height:19px;}
.net-sep{font-size:13px;color:#b3b1a8;}
/* ---- 房间卡片 ---- */
.room-box{margin:16px auto 0;max-width:560px;background:#faf9f5;border:1.5px dashed #cfccc2;border-radius:14px;padding:16px 20px 10px;text-align:center;}
.room-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.room-label{font-size:12px;letter-spacing:2px;color:#8a887f;font-weight:600;}
.room-code{font-size:28px;font-weight:800;letter-spacing:7px;color:#1c1c1e;font-family:ui-monospace,Consolas,Menlo,monospace;}
.room-copy{height:34px;padding:0 14px;font-size:13px;}
.room-tip{margin:9px 0 4px;font-size:12.5px;color:#8a887f;}
.turn-wrap{text-align:center;margin:18px 0 14px;}
.turn{display:inline-flex;align-items:center;gap:9px;background:#f4f3ef;border:1px solid #e3e1da;border-radius:999px;padding:7px 18px;font-size:15px;font-weight:600;color:#333;}
.turn .dot{width:15px;height:15px;border-radius:50%;}
.turn .dot.b{background:radial-gradient(circle at 35% 30%,#5a5a5a,#000 70%);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.turn .dot.w{background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc 75%);border:1px solid #c4c4c4;}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.row input{height:42px;width:190px;padding:0 14px;border:1px solid #d5d3cb;border-radius:10px;font-size:15px;color:#333;outline:none;transition:border-color .15s,box-shadow .15s;}
.row input::placeholder{color:#b3b1a8;}
.row input:focus{border-color:#4c52d6;box-shadow:0 0 0 3px rgba(76,82,214,.14);}
.btn{height:42px;padding:0 24px;border-radius:10px;font-size:15px;cursor:pointer;border:1px solid #d5d3cb;background:#fff;color:#3a3a3a;transition:background .15s,border-color .15s;}
.btn:hover{background:#f4f3ef;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:#4c52d6;border-color:#4c52d6;color:#fff;}
.btn.primary:hover{background:#4147c0;border-color:#4147c0;}
#msg{text-align:center;font-size:14px;min-height:22px;margin:12px 0 2px;}
.hint{text-align:center;font-size:13px;color:#9a988e;margin:4px 0 0;}
/* ---- 对局记录表 ---- */
.moves{background:#faf9f5;border:1px solid #ecebe6;border-radius:12px;padding:10px 12px 8px;}
.moves h3{margin:0 0 6px;font-size:12px;color:#8a887f;letter-spacing:2px;font-weight:600;}
.mt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.mt th{font-size:11px;color:#8a887f;text-align:center;padding:4px 2px;border-bottom:1px solid #e6e4dc;letter-spacing:1px;font-weight:600;}
.mt td{padding:5px 2px;text-align:center;border-bottom:1px solid #f1efe9;color:#333;}
.mt .col-num{width:38px;color:#8a887f;}
.mt .p{font-weight:700;}
.mt .p.b{color:#1c1c1e;}
.mt .p.w{color:#7a7a7a;}
.mt .xy{font-family:ui-monospace,Consolas,Menlo,monospace;}
.mt tr.last td{background:#fff5d6;}
.mt tr.last .xy{color:#1c1c1e;font-weight:600;}
.mt-wrap{max-height:240px;overflow-y:auto;border-radius:6px;}
/* ---- 结算界面（仿 osu! lazer ResultsScreen）---- */
.results{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s;}
.results.show{opacity:1;visibility:visible;}
.rs-backdrop{position:absolute;inset:0;background:rgba(22,22,28,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
.rs-panel{position:relative;z-index:2;background:#fff;border-radius:22px;padding:38px 58px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);opacity:0;transform:scale(.82) translateY(26px);transition:transform .55s cubic-bezier(.23,1,.32,1),opacity .3s ease;}
.rs-panel.in{opacity:1;transform:scale(1) translateY(0);}
.rs-tag{font-size:13px;letter-spacing:3px;color:#8a887f;text-transform:uppercase;opacity:0;transform:translateY(8px);}
.rs-tag.in{opacity:1;transform:translateY(0);transition:opacity .35s ease,transform .4s cubic-bezier(.23,1,.32,1);}
.rs-badge{width:88px;height:88px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin:16px auto 10px;transform:scale(0);}
.rs-badge.in{animation:pop .75s cubic-bezier(.34,1.56,.64,1) both;}
.rs-badge.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,#000 70%);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.rs-badge.w{background:radial-gradient(circle at 35% 30%,#fff,#e4e4e4 75%);color:#111;border:2px solid #c9c9c9;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.rs-badge.tie{background:#8a8a8a;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);}
@keyframes pop{
  0%{transform:scale(0) rotate(-16deg);}
  55%{transform:scale(1.22) rotate(5deg);}
  75%{transform:scale(.9) rotate(-3deg);}
  100%{transform:scale(1) rotate(0);}
}
.rs-title{font-size:34px;font-weight:800;color:#1c1c1e;display:inline-flex;align-items:center;gap:14px;transform:translateY(18px);opacity:0;}
.rs-title.in{transform:translateY(0);opacity:1;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;}
.rs-dot{width:30px;height:30px;border-radius:50%;}
.rs-dot.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,#000 70%);box-shadow:0 2px 6px rgba(0,0,0,.4);}
.rs-dot.w{background:radial-gradient(circle at 35% 30%,#fff,#e4e4e4 75%);border:2px solid #c9c9c9;}
.rs-dot.tie{background:#8a8a8a;}
.rs-btns{margin-top:28px;display:flex;gap:12px;justify-content:center;opacity:0;transform:translateY(12px);}
.rs-btns.in{opacity:1;transform:translateY(0);transition:opacity .3s ease,transform .45s cubic-bezier(.23,1,.32,1);}
.rs-particles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.rs-particles span.pr{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);animation:fly 1s cubic-bezier(.23,1,.32,1) forwards;}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  75%{opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1);opacity:0;}
}
.rs-ring{position:fixed;left:50%;top:50%;width:60px;height:60px;border:4px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:101;pointer-events:none;animation:ringOut .8s cubic-bezier(.23,1,.32,1) forwards;}
@keyframes ringOut{to{transform:translate(-50%,-50%) scale(24);opacity:0;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <span class="lg b"></span><span class="lg w"></span><span class="lg b"></span><span class="lg w"></span>
  </div>
  <h1>四子棋</h1>
  <p class="sub">在平面直角坐标系中按坐标落子，先连成四子者获胜</p>

  <div class="layout">
    <div class="layout-left">
      <svg id="board" class="board" role="img">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
          </marker>
          <radialGradient id="gBlack" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#5a5a5a"/>
            <stop offset="55%" stop-color="#161616"/>
            <stop offset="100%" stop-color="#000000"/>
          </radialGradient>
          <radialGradient id="gWhite" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#f7f7f7"/>
            <stop offset="100%" stop-color="#dbdbdb"/>
          </radialGradient>
        </defs>
        <g id="gGrid"></g>
        <g id="gPieces"></g>
      </svg>
    </div>

    <div class="layout-right">
      <div class="net">
        <span class="net-tag">联机对战</span>
        <button id="btnCreate" class="btn primary">创建房间</button>
        <span class="net-sep">或</span>
        <input id="netRoom" type="text" placeholder="朋友给的房间号，如 K3F2A9" maxlength="24">
        <button id="btnJoin" class="btn">加入房间</button>
        <button id="btnLeave" class="btn" style="display:none">离开房间</button>
      </div>
      <div id="roomBox" class="room-box" style="display:none">
        <div class="room-row">
          <span class="room-label" id="roomBoxTitle">房间号</span>
          <span class="room-code" id="roomCode">——</span>
          <button id="btnCopy" class="btn room-copy">复制</button>
        </div>
        <p class="room-tip" id="roomTip"></p>
      </div>
      <p class="net-status" id="netStatus">本地对战 · 和朋友联机，点“创建房间”或输入朋友给的房间号</p>

      <div class="turn-wrap"><span class="turn" id="turnMsg"></span></div>
      <div class="row">
        <input id="coord" type="text" placeholder="(3,-5)">
        <button id="btnPut" class="btn primary">落子</button>
        <button id="btnReset" class="btn">重新开始</button>
      </div>
      <p id="msg"></p>

      <div class="moves">
        <h3>对局记录</h3>
        <div class="mt-wrap">
          <table class="mt">
            <thead><tr><th class="h">#</th><th class="h">玩家</th><th class="h">坐标</th></tr></thead>
            <tbody id="movesBody"></tbody>
          </table>
        </div>
      </div>

      <p class="hint">输入格式：(x,y)，括号与逗号不限半角或全角；x、y 为 -10 到 10 之间的整数。</p>
    </div>
  </div>
</div>

<div id="results" class="results">
  <div class="rs-backdrop"></div>
  <div class="rs-panel">
    <div class="rs-tag" id="rsTag">对局结束</div>
    <div class="rs-badge" id="rsBadge">胜</div>
    <div class="rs-title" id="rsTitle"><span class="rs-dot" id="rsDot"></span><span id="rsTxt">黑棋 胜利</span></div>
    <div class="rs-btns" id="rsBtns">
      <button class="btn primary" id="btnRetry">再来一局</button>
      <button class="btn" id="btnBack">返回棋盘</button>
    </div>
  </div>
  <div class="rs-particles" id="rsParticles"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var N=21, CELL=32;
  var OFF=10; // 坐标范围 -10 ~ +10
  var PAD={t:30,l:52,b:48,r:28};
  var W=PAD.l+(N-1)*CELL+PAD.r;
  var H=PAD.t+(N-1)*CELL+PAD.b;
  var svg=document.getElementById('board');
  var gGrid=document.getElementById('gGrid');
  var gPieces=document.getElementById('gPieces');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);

  var board={}, cur=1, moves=0, over=false, log=[]; // log: 每步 [x,y,color]
  var DIRS=[[1,0],[0,1],[1,1],[1,-1]];

  // ---- Supabase 联机配置（你项目的信息）----
  var SUPABASE_URL='https://hdipuzeisalqqvglqaib.supabase.co';
  var SUPABASE_KEY='sb_publishable_1B3vDVW-k9XUAWGLLrtbrg_ohDMySwD';
  var SB_CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  var net={on:false,loading:false,ch:null,sb:null,pid:'',since:0,room:'',color:0,opp:null,seq:0,lastSeq:{},created:false};

  function el(tag,attrs){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs)e.setAttribute(k,attrs[k]);
    return e;
  }
  // 数学坐标 (x,y) -> 屏幕像素（原点在棋盘中心）
  function toScreen(x,y){
    return [PAD.l+(x+OFF)*CELL, PAD.t+(OFF-y)*CELL];
  }

  function buildBoard(){
    for(var i=0;i<N;i++){
      if(i===OFF)continue;
      var gx=PAD.l+i*CELL;
      gGrid.appendChild(el('line',{class:'gl',x1:gx,y1:PAD.t,x2:gx,y2:PAD.t+(N-1)*CELL}));
      var gy=PAD.t+i*CELL;
      gGrid.appendChild(el('line',{class:'gl',x1:PAD.l,y1:gy,x2:PAD.l+(N-1)*CELL,y2:gy}));
    }
    var ax=PAD.l+OFF*CELL, ay=PAD.t+OFF*CELL;
    gGrid.appendChild(el('line',{class:'ax',x1:PAD.l,y1:ay,x2:PAD.l+(N-1)*CELL,y2:ay,'marker-end':'url(#arrow)'}));
    gGrid.appendChild(el('line',{class:'ax',x1:ax,y1:PAD.t+(N-1)*CELL,x2:ax,y2:PAD.t,'marker-end':'url(#arrow)'}));
    for(var j=0;j<N;j++){
      var v=j-OFF;
      if(v!==0){
        var tx=el('text',{class:'lab',x:PAD.l+j*CELL,y:ay+24,'text-anchor':'middle'});
        tx.textContent=v;gGrid.appendChild(tx);
        var ty=el('text',{class:'lab',x:ax-16,y:PAD.t+j*CELL+5,'text-anchor':'end'});
        ty.textContent=OFF-j;gGrid.appendChild(ty);
      }
    }
    var o=el('text',{class:'lab',x:ax+6,y:ay+20});o.textContent='O';gGrid.appendChild(o);
    var xl=el('text',{class:'lab axname',x:PAD.l+(N-1)*CELL+18,y:ay+5});xl.textContent='x';gGrid.appendChild(xl);
    var yl=el('text',{class:'lab axname',x:ax-22,y:PAD.t-8});yl.textContent='y';gGrid.appendChild(yl);
  }

  function drawPiece(x,y,p){
    var c=toScreen(x,y);
    gPieces.appendChild(el('circle',{cx:c[0],cy:c[1],r:CELL*0.42,class:p===1?'pc black':'pc white'}));
    if(p===1){
      gPieces.appendChild(el('circle',{cx:c[0]-CELL*0.13,cy:c[1]-CELL*0.16,r:CELL*0.11,fill:'rgba(255,255,255,.55)'}));
    }
  }

  function countDir(x,y,p,dx,dy){
    var c=0,nx=x+dx,ny=y+dy;
    while(nx>=-OFF&&nx<=OFF&&ny>=-OFF&&ny<=OFF&&board[nx+','+ny]===p){c++;nx+=dx;ny+=dy;}
    return c;
  }
  function checkWin(x,y,p){
    for(var k=0;k<DIRS.length;k++){
      var dx=DIRS[k][0],dy=DIRS[k][1];
      if(1+countDir(x,y,p,dx,dy)+countDir(x,y,p,-dx,-dy)>=4){
        var x1=x,y1=y,x2=x,y2=y;
        while(x1-dx>=-OFF&&x1-dx<=OFF&&y1-dy>=-OFF&&y1-dy<=OFF&&board[(x1-dx)+','+(y1-dy)]===p){x1-=dx;y1-=dy;}
        while(x2+dx>=-OFF&&x2+dx<=OFF&&y2+dy>=-OFF&&y2+dy<=OFF&&board[(x2+dx)+','+(y2+dy)]===p){x2+=dx;y2+=dy;}
        for(var cx=x1,cy=y1;;cx+=dx,cy+=dy){
          var c=toScreen(cx,cy);
          gPieces.appendChild(el('circle',{cx:c[0],cy:c[1],r:CELL*0.5,class:'ring'}));
          if(cx===x2&&cy===y2)break;
        }
        return true;
      }
    }
    return false;
  }

  // 判定刚落的一手是否结束棋局；结束则弹出结算
  function resolveEnd(x,y,p){
    if(checkWin(x,y,p)){ over=true; showResults(p); return true; }
    if(moves===N*N){ over=true; showResults(0); return true; }
    return false;
  }

  function place(x,y){
    board[x+','+y]=cur;
    moves++;
    log.push([x,y,cur]);
    drawPiece(x,y,cur);
    if(resolveEnd(x,y,cur)){
      renderLog();
      if(net.on)sendState();
      return;
    }
    cur=cur===1?2:1;
    updateMsg();
    renderLog();
    if(net.on)sendState();
  }

  function updateMsg(){
    var t=document.getElementById('turnMsg');
    var who=cur===1?'黑方':'白方';
    var extra='';
    if(net.on&&net.color!==0&&!over){
      extra=cur===net.color?' · 轮到你':' · 等对方';
    }
    t.innerHTML='<span class="dot '+(cur===1?'b':'w')+'"></span>当前：'+who+'落子'+extra;
  }

  // 渲染右侧"对局记录"表格（按 log 数组重建）
  function renderLog(){
    var body=document.getElementById('movesBody');
    if(!body)return;
    var html='';
    for(var i=0;i<log.length;i++){
      var m=log[i];
      var n=i+1;
      var c=m[2]===1?'b':'w';
      var name=m[2]===1?'黑':'白';
      var lastCls=(i===log.length-1)?' class="last"':'';
      html+='<tr'+lastCls+'><td class="col-num">'+n+'</td><td class="p '+c+'">'+name+'</td><td class="xy">('+m[0]+', '+m[1]+')</td></tr>';
    }
    body.innerHTML=html;
  }

  function showMsg(t,isErr){
    var m=document.getElementById('msg');
    m.textContent=t;
    m.style.color=isErr?'#d33a3f':'#15803d';
  }

  function netStatus(t,isErr){
    var s=document.getElementById('netStatus');
    s.textContent=t;
    s.style.color=isErr?'#d33a3f':'#8a887f';
  }

  // 解析坐标输入 "(x,y)"：括号、逗号不限半角或全角
  function parseCoord(s){
    s=s.trim();
    var inner=null;
    if(s.length>=2){
      var a=s.charAt(0), b=s.charAt(s.length-1);
      if((a==='('&&b===')')||(a==='（'&&b==='）'))inner=s.slice(1,-1);
    }
    if(inner===null)return {err:'格式'};
    var parts=inner.split(/[,，]/);
    if(parts.length!==2)return {err:'格式'};
    var xs=parts[0].trim(), ys=parts[1].trim();
    if(xs===''||ys==='')return {err:'格式'};
    var x=Number(xs), y=Number(ys);
    if(!Number.isInteger(x)||!Number.isInteger(y))return {err:'整数'};
    if(x<-OFF||x>OFF||y<-OFF||y>OFF)return {err:'范围'};
    return {x:x,y:y};
  }

  function put(){
    if(over){
      showMsg('棋局已结束，请点击“重新开始”。',true);
      return;
    }
    if(net.on&&!net.color){
      showMsg('联机中：还没拿到执棋权，请稍候或检查房间。',true);
      return;
    }
    var r=parseCoord(document.getElementById('coord').value);
    if(r.err==='格式'){
      showMsg('判定为“假”：请按 (x,y) 格式输入，例如 (3,-5)，括号与逗号可用半角或全角。',true);
      return;
    }
    if(r.err==='整数'){
      showMsg('判定为“假”：x、y 必须是整数。',true);
      return;
    }
    if(r.err==='范围'){
      showMsg('判定为“假”：x、y 需在 -10 到 10 之间。',true);
      return;
    }
    if(board[r.x+','+r.y]){showMsg('该位置已有棋子。',true);return;}
    if(net.on){
      if(cur!==net.color){
        showMsg('还没轮到你，请等对方落子。',true);
        return;
      }
    }
    var colorName=cur===1?'黑':'白';
    place(r.x,r.y);
    showMsg('判定为“真”：已在 ('+r.x+', '+r.y+') 落'+colorName+'子。');
    document.getElementById('coord').value='';
  }

  function reset(){
    board={};
    cur=1;moves=0;over=false;log=[];
    gPieces.innerHTML='';
    document.getElementById('coord').value='';
    showMsg('');
    hideResults();
    updateMsg();
    renderLog();
    if(net.on)sendState();
  }

  // ---- 结算界面（仿 osu! lazer ResultsScreen）----
  function burst(){
    var host=document.getElementById('rsParticles');
    host.innerHTML='';
    var colors=['#ff5d5d','#ffb84d','#ffd84d','#6ee36e','#5db8ff','#a07dff','#ff7df0'];
    for(var i=0;i<50;i++){
      var s=document.createElement('span');
      s.className='pr';
      var size=5+Math.random()*9;
      var ang=Math.random()*Math.PI*2;
      var dist=140+Math.random()*280;
      var dur=0.9+Math.random()*1.2;
      s.style.cssText='width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';animation-duration:'+dur+'s;';
      s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
      s.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
      host.appendChild(s);
    }
    var ring=document.createElement('div');
    ring.className='rs-ring';
    document.body.appendChild(ring);
    setTimeout(function(){ring.remove();},850);
  }

  function showResults(w){
    var R=document.getElementById('results');
    var panel=R.querySelector('.rs-panel');
    var tag=document.getElementById('rsTag');
    var badge=document.getElementById('rsBadge');
    var dot=document.getElementById('rsDot');
    var txt=document.getElementById('rsTxt');
    var title=document.getElementById('rsTitle');
    var btns=document.getElementById('rsBtns');
    if(w===0){
      badge.textContent='平';
      badge.className='rs-badge tie';
      dot.className='rs-dot tie';
      txt.textContent='平局';
    }else{
      var isBlack=w===1;
      badge.textContent='胜';
      badge.className='rs-badge '+(isBlack?'b':'w');
      dot.className='rs-dot '+(isBlack?'b':'w');
      txt.textContent=(isBlack?'黑棋':'白棋')+' 胜利';
    }
    document.getElementById('turnMsg').innerHTML='对局已结束';
    [panel,tag,badge,title,btns].forEach(function(e){e.classList.remove('in');});
    R.classList.remove('show');
    void R.offsetWidth;
    R.classList.add('show');
    void panel.offsetWidth;
    panel.classList.add('in');
    setTimeout(function(){tag.classList.add('in');},130);
    setTimeout(function(){badge.classList.add('in');},320);
    setTimeout(function(){title.classList.add('in');},500);
    setTimeout(function(){btns.classList.add('in');},900);
    setTimeout(burst,420);
  }

  function hideResults(){
    document.getElementById('results').classList.remove('show');
  }

    // ================== 联机模块 ==================
  function sameLog(arr){
    if(arr.length!==log.length)return false;
    for(var i=0;i<arr.length;i++){
      var a=arr[i], b=log[i];
      if(a[0]!==b[0]||a[1]!==b[1]||a[2]!==b[2])return false;
    }
    return true;
  }

  // 用远端棋谱重建整个棋盘（清空后按顺序重放）
  function rebuildFromLog(arr){
    if(sameLog(arr))return;
    hideResults();
    gPieces.innerHTML='';
    board={};cur=1;moves=0;over=false;log=[];
    for(var i=0;i<arr.length;i++){
      var m=arr[i];
      board[m[0]+','+m[1]]=m[2];
      moves++;
      log.push(m);
      drawPiece(m[0],m[1],m[2]);
    }
    if(log.length){
      var last=log[log.length-1];
      cur=last[2]===1?2:1;
      if(checkWin(last[0],last[1],last[2])){ over=true; renderLog(); showResults(last[2]); return; }
      if(moves===N*N){ over=true; renderLog(); showResults(0); return; }
    }
    renderLog();
    updateMsg();
    document.getElementById('coord').value='';
  }

  function sendState(){
    if(net.on&&net.ch){
      net.seq=(net.seq||0)+1;
      net.ch.send({type:'broadcast',event:'state',payload:{log:log.slice(),from:net.pid,seq:net.seq}});
    }
  }
  function sendRoles(targetPid,c){
    if(net.on&&net.ch&&targetPid){
      net.ch.send({type:'broadcast',event:'roles',payload:{pid:targetPid,color:c}});
    }
  }
  function adoptRole(c){
    if(c!==1&&c!==2)return;
    net.color=c;
    netStatus(c===1?'已连接房间 '+net.room+' · 你是黑方（先手） · 对方已就位'
                  :'已连接房间 '+net.room+' · 你是白方 · 对方已就位');
    updateMsg();
  }

  function onlineList(){
    if(!net.ch)return[];
    var st=net.ch.presenceState();
    var out=[];
    Object.keys(st).forEach(function(k){
      var arr=st[k];
      if(arr&&arr.length)out.push(arr[arr.length-1]);
    });
    out.sort(function(a,b){
      return (a.since-b.since)||(a.pid<b.pid?-1:1);
    });
    return out;
  }

  // 依据进房先后分配执棋：最早进入的黑方，次之白方
  function syncRoles(){
    if(!net.on||!net.ch)return;
    var list=onlineList();
    var idx=-1;
    for(var i=0;i<list.length;i++){
      if(list[i].pid===net.pid){idx=i;break;}
    }
    if(idx<0){updateRoomTip(list.length);return;}
    net.opp=(list.length>=2)?(list[idx===0?1:0].pid):null;
    if(idx>=2){
      net.color=0;
      netStatus('房间 '+net.room+' 已有两名玩家，你在旁观（只读）');
      updateMsg();
      updateRoomTip(list.length);
      return;
    }
    if(idx===0&&list.length===1){
      if(net.color===0&&log.length===0&&!over){
        net.color=1;
        if(net.created){
          netStatus('房间已创建：'+net.room+' · 你是黑方（先手），等朋友输入房间号加入…');
        }else{
          netStatus('已连接房间 '+net.room+' · 你是黑方（先手），等待白方加入…');
        }
      }else if(log.length>0&&!over){
        netStatus('对方已离开，正在等待对方回到房间…');
      }
      updateMsg();
      updateRoomTip(list.length);
      return;
    }
    if(net.color===0){
      net.color=idx===0?1:2;
    }
    netStatus(net.color===1?'已连接房间 '+net.room+' · 你是黑方（先手） · 对方已就位'
                          :'已连接房间 '+net.room+' · 你是白方 · 对方已就位');
    updateMsg();
    updateRoomTip(list.length);
  }

  // 房间卡片底部提示：按当前在场人数与身份切换文案
  function updateRoomTip(present){
    var box=document.getElementById('roomBox');
    if(!box||box.style.display==='none')return;
    var tip=document.getElementById('roomTip');
    if(present>=2){
      tip.textContent='对方已就位，可以开始对局了';
    }else if(net.created){
      tip.textContent='房间已创建：把上面的房间号发给朋友，让 ta 点“加入房间”并输入该号码';
    }else{
      tip.textContent='正在连接房间，等待开始…';
    }
  }

  function onPresenceJoin(ctx){
    if(!net.on||!net.ch)return;
    var pres=ctx&&ctx.currentPresences&&ctx.currentPresences.length
      ?ctx.currentPresences[ctx.currentPresences.length-1]:null;
    if(!pres)return;
    var arrived=pres.pid||'';
    if(arrived===net.pid)return;
    var list=onlineList();
    if(list.length===2&&net.color&&log.length>0&&!over){
      // 对局中途有对手（回来/新玩家）加入：指定其执反色，并把当前局面同步给他
      sendRoles(arrived,3-net.color);
    }
    if(log.length>0){
      sendState();
    }
  }

  function applyRemoteState(msg){
    if(!net.on||!msg||!msg.payload)return;
    var p=msg.payload;
    if(p.seq!==undefined&&net.lastSeq[p.from]!==undefined&&p.seq<=net.lastSeq[p.from])return;
    net.lastSeq[p.from]=p.seq;
    rebuildFromLog(p.log||[]);
  }

  function refreshNetUI(){
    var j=document.getElementById('btnJoin');
    var l=document.getElementById('btnLeave');
    var r=document.getElementById('netRoom');
    var box=document.getElementById('roomBox');
    if(net.on){
      j.style.display='none';
      l.style.display='';
      r.disabled=true;
      r.value=net.room;
      box.style.display='block';
      document.getElementById('roomCode').textContent=net.room;
      document.getElementById('roomBoxTitle').textContent=net.created?'你的房间号':'已加入房间';
      var c=document.getElementById('btnCopy');
      c.textContent='复制';
    }else{
      j.style.display='';
      l.style.display='none';
      r.disabled=false;
      box.style.display='none';
    }
  }

  function doJoin(room){
    if(net.on){
      try{net.ch.untrack().then(function(){net.ch.unsubscribe();});}catch(e){}
      net.ch=null;
    }
    net.room=room;
    net.seq=0;
    net.lastSeq={};
    net.sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
    if(!net.sb){
      netStatus('联机组件加载失败，请刷新页面或检查网络',true);
      net.loading=false;
      return;
    }
    net.ch=net.sb.channel('fourinrow:'+room,{config:{broadcast:{self:false}}});
    net.ch.on('broadcast',{event:'state'},applyRemoteState);
    net.ch.on('broadcast',{event:'roles'},function(msg){
      if(net.on&&msg.payload&&msg.payload.pid===net.pid){
        adoptRole(msg.payload.color);
      }
    });
    net.ch.on('presence',{event:'sync'},syncRoles);
    net.ch.on('presence',{event:'join'},onPresenceJoin);
    net.ch.on('presence',{event:'leave'},function(){ if(net.on)syncRoles(); });
    netStatus('正在连接房间 '+room+' …');
    net.ch.subscribe(function(status){
      if(status==='SUBSCRIBED'){
        net.on=true;
        net.ch.track({pid:net.pid,since:net.since}).then(function(){
          refreshNetUI();
          sessionStorage.setItem('gb4_room',net.room);
          syncRoles();
          net.loading=false;
        });
      }else if(status==='CHANNEL_ERROR'){
        netStatus('连接失败：请检查网络，或确认 Supabase Realtime 已开启',true);
        net.loading=false;
      }else if(status==='TIMED_OUT'){
        netStatus('连接超时，请重试',true);
        net.loading=false;
      }
    });
  }

  function loadSB(cb){
    if(window.supabase&&window.supabase.createClient){cb();return;}
    var s=document.createElement('script');
    s.src=SB_CDN;
    s.onload=function(){cb();};
    s.onerror=function(){
      netStatus('联机组件下载失败，请检查网络连接',true);
      net.loading=false;
    };
    document.head.appendChild(s);
  }

  function joinRoom(room, created){
    if(net.loading)return;
    if(net.on)leaveRoom();
    net.created=!!created;
    net.loading=true;
    if(!window.supabase){
      loadSB(function(){doJoin(room);});
    }else{
      doJoin(room);
    }
  }

  function leaveRoom(){
    if(net.ch){
      try{net.ch.untrack().then(function(){net.ch.unsubscribe();});}catch(e){}
      net.ch=null;
    }
    net.on=false;
    net.color=0;
    net.opp=null;
    net.room='';
    net.created=false;
    sessionStorage.removeItem('gb4_room');
    refreshNetUI();
    netStatus('本地对战 · 和朋友联机，点“创建房间”或输入朋友给的房间号');
    reset();
  }

  // 生成 6 位房间号（避开易混淆的 0/O/1/I/L）
  var ROOM_ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function genCode(){
    var s='';
    for(var i=0;i<6;i++){
      s+=ROOM_ALPH.charAt(Math.floor(Math.random()*ROOM_ALPH.length));
    }
    return s;
  }

  function copyRoom(){
    if(!net.room)return;
    var b=document.getElementById('btnCopy');
    function done(){b.textContent='已复制';setTimeout(function(){b.textContent='复制';},1400);}
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=net.room;
      ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      try{document.execCommand('copy');done();}
      catch(e){netStatus('复制失败，请手动记住房间号 '+net.room,true);}
      ta.remove();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(net.room).then(done)['catch'](fallback);
    }else{
      fallback();
    }
  }

  function initPlayerId(){
    net.pid=sessionStorage.getItem('gb4_pid');
    if(!net.pid){
      net.pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
      sessionStorage.setItem('gb4_pid',net.pid);
    }
    var since=sessionStorage.getItem('gb4_since');
    if(!since){
      since=String(Date.now());
      sessionStorage.setItem('gb4_since',since);
    }
    net.since=Number(since);
  }

  // ---- 事件绑定 ----
  document.getElementById('btnPut').addEventListener('click',put);
  document.getElementById('btnReset').addEventListener('click',reset);
  document.getElementById('btnRetry').addEventListener('click',function(){reset();});
  document.getElementById('btnBack').addEventListener('click',hideResults);
  document.getElementById('coord').addEventListener('keydown',function(e){
    if(e.key==='Enter')put();
  });
  document.getElementById('netRoom').addEventListener('keydown',function(e){
    if(e.key==='Enter')btnJoinClick();
  });
  function btnJoinClick(){
    var room=document.getElementById('netRoom').value.trim();
    if(!room){
      netStatus('请先输入房间号',true);
      return;
    }
    joinRoom(room);
  }
  function btnCreateClick(){
    if(net.loading){
      netStatus('正在连接，请稍候…',true);
      return;
    }
    if(net.on)leaveRoom();
    joinRoom(genCode(),true);
  }
  document.getElementById('btnJoin').addEventListener('click',btnJoinClick);
  document.getElementById('btnCreate').addEventListener('click',btnCreateClick);
  document.getElementById('btnCopy').addEventListener('click',copyRoom);
  document.getElementById('btnLeave').addEventListener('click',leaveRoom);

  // ---- 启动 ----
  buildBoard();
  initPlayerId();
  reset();
  var savedRoom=sessionStorage.getItem('gb4_room');
  if(savedRoom){
    document.getElementById('netRoom').value=savedRoom;
    setTimeout(function(){joinRoom(savedRoom);},400);
  }
})();
</script>
