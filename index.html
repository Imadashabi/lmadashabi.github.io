<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四子棋（坐标落子版）</title>
<style>
*{box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f1efe9;color:#333;margin:0;padding:32px 16px;line-height:1.6;}
.wrap{max-width:760px;margin:0 auto;background:#fff;border:1px solid #ecebe6;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);padding:34px 34px 26px;}
.logo{display:flex;gap:7px;justify-content:center;margin-bottom:12px;}
.lg{width:15px;height:15px;border-radius:50%;}
.lg.b{background:radial-gradient(circle at 35% 30%,#5a5a5a,#000 70%);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.lg.w{background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc 75%);border:1px solid #c4c4c4;box-shadow:0 1px 2px rgba(0,0,0,.15);}
h1{font-size:25px;text-align:center;margin:0 0 4px;color:#1c1c1e;letter-spacing:1px;}
.sub{text-align:center;color:#8a887f;font-size:14px;margin:0 0 20px;}
svg.board{display:block;margin:0 auto;max-width:640px;width:100%;height:auto;background:#fffdf8;border:1px solid #e6e4dc;border-radius:10px;}
.gl{stroke:#d9d6cc;stroke-width:1;}
.ax{stroke:#333;stroke-width:2;}
.lab{font-size:12px;fill:#777;}
.axname{font-size:15px;font-weight:bold;font-style:italic;fill:#333;}
.pc.black{fill:url(#gBlack);}
.pc.white{fill:url(#gWhite);stroke:#c0c0c0;stroke-width:1;}
.ring{fill:none;stroke:#e5484d;stroke-width:2.5;}
.turn-wrap{text-align:center;margin:18px 0 14px;}
.turn{display:inline-flex;align-items:center;gap:9px;background:#f4f3ef;border:1px solid #e3e1da;border-radius:999px;padding:7px 18px;font-size:15px;font-weight:600;color:#333;}
.turn .dot{width:15px;height:15px;border-radius:50%;}
.turn .dot.b{background:radial-gradient(circle at 35% 30%,#5a5a5a,#000 70%);box-shadow:0 1px 2px rgba(0,0,0,.35);}
.turn .dot.w{background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc 75%);border:1px solid #c4c4c4;}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.row input{height:42px;width:190px;padding:0 14px;border:1px solid #d5d3cb;border-radius:10px;font-size:15px;color:#333;outline:none;transition:border-color .15s,box-shadow .15s;}
.row input::placeholder{color:#b3b1a8;}
.row input:focus{border-color:#4c52d6;box-shadow:0 0 0 3px rgba(76,82,214,.14);}
.btn{height:42px;padding:0 24px;border-radius:10px;font-size:15px;cursor:pointer;border:1px solid #d5d3cb;background:#fff;color:#3a3a3a;transition:background .15s,border-color .15s;}
.btn:hover{background:#f4f3ef;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:#4c52d6;border-color:#4c52d6;color:#fff;}
.btn.primary:hover{background:#4147c0;border-color:#4147c0;}
#msg{text-align:center;font-size:14px;min-height:22px;margin:12px 0 2px;}
.hint{text-align:center;font-size:13px;color:#9a988e;margin:4px 0 0;}
/* ---- 结算界面（仿 osu! lazer ResultsScreen）---- */
.results{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s;}
.results.show{opacity:1;visibility:visible;}
.rs-backdrop{position:absolute;inset:0;background:rgba(22,22,28,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
.rs-panel{position:relative;z-index:2;background:#fff;border-radius:22px;padding:38px 58px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);opacity:0;transform:scale(.82) translateY(26px);transition:transform .55s cubic-bezier(.23,1,.32,1),opacity .3s ease;}
.rs-panel.in{opacity:1;transform:scale(1) translateY(0);}
.rs-tag{font-size:13px;letter-spacing:3px;color:#8a887f;text-transform:uppercase;opacity:0;transform:translateY(8px);}
.rs-tag.in{opacity:1;transform:translateY(0);transition:opacity .35s ease,transform .4s cubic-bezier(.23,1,.32,1);}
.rs-badge{width:88px;height:88px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin:16px auto 10px;transform:scale(0);}
.rs-badge.in{animation:pop .75s cubic-bezier(.34,1.56,.64,1) both;}
.rs-badge.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,#000 70%);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.rs-badge.w{background:radial-gradient(circle at 35% 30%,#fff,#e4e4e4 75%);color:#111;border:2px solid #c9c9c9;box-shadow:0 6px 20px rgba(0,0,0,.18);}
.rs-badge.tie{background:#8a8a8a;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);}
@keyframes pop{
  0%{transform:scale(0) rotate(-16deg);}
  55%{transform:scale(1.22) rotate(5deg);}
  75%{transform:scale(.9) rotate(-3deg);}
  100%{transform:scale(1) rotate(0);}
}
.rs-title{font-size:34px;font-weight:800;color:#1c1c1e;display:inline-flex;align-items:center;gap:14px;transform:translateY(18px);opacity:0;}
.rs-title.in{transform:translateY(0);opacity:1;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;}
.rs-dot{width:30px;height:30px;border-radius:50%;}
.rs-dot.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,#000 70%);box-shadow:0 2px 6px rgba(0,0,0,.4);}
.rs-dot.w{background:radial-gradient(circle at 35% 30%,#fff,#e4e4e4 75%);border:2px solid #c9c9c9;}
.rs-dot.tie{background:#8a8a8a;}
.rs-btns{margin-top:28px;display:flex;gap:12px;justify-content:center;opacity:0;transform:translateY(12px);}
.rs-btns.in{opacity:1;transform:translateY(0);transition:opacity .3s ease,transform .45s cubic-bezier(.23,1,.32,1);}
.rs-particles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.rs-particles span.pr{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);animation:fly 1s cubic-bezier(.23,1,.32,1) forwards;}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  75%{opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1);opacity:0;}
}
.rs-ring{position:fixed;left:50%;top:50%;width:60px;height:60px;border:4px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:101;pointer-events:none;animation:ringOut .8s cubic-bezier(.23,1,.32,1) forwards;}
@keyframes ringOut{to{transform:translate(-50%,-50%) scale(24);opacity:0;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <span class="lg b"></span><span class="lg w"></span><span class="lg b"></span><span class="lg w"></span>
  </div>
  <h1>四子棋</h1>
  <p class="sub">在平面直角坐标系中按坐标落子，先连成四子者获胜</p>

  <svg id="board" class="board" role="img">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
      </marker>
      <radialGradient id="gBlack" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#5a5a5a"/>
        <stop offset="55%" stop-color="#161616"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>
      <radialGradient id="gWhite" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f7f7f7"/>
        <stop offset="100%" stop-color="#dbdbdb"/>
      </radialGradient>
    </defs>
    <g id="gGrid"></g>
    <g id="gPieces"></g>
  </svg>

  <div class="turn-wrap"><span class="turn" id="turnMsg"></span></div>
  <div class="row">
    <input id="coord" type="text" placeholder="(3,-5)">
    <button id="btnPut" class="btn primary">落子</button>
    <button id="btnReset" class="btn">重新开始</button>
  </div>
  <p id="msg"></p>
  <p class="hint">输入格式：(x,y)，括号与逗号不限半角或全角；x、y 为 -10 到 10 之间的整数。</p>
</div>

<div id="results" class="results">
  <div class="rs-backdrop"></div>
  <div class="rs-panel">
    <div class="rs-tag" id="rsTag">对局结束</div>
    <div class="rs-badge" id="rsBadge">胜</div>
    <div class="rs-title" id="rsTitle"><span class="rs-dot" id="rsDot"></span><span id="rsTxt">黑棋 胜利</span></div>
    <div class="rs-btns" id="rsBtns">
      <button class="btn primary" id="btnRetry">再来一局</button>
      <button class="btn" id="btnBack">返回棋盘</button>
    </div>
  </div>
  <div class="rs-particles" id="rsParticles"></div>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var N=21, CELL=32;
  var OFF=10; // 坐标范围 -10 ~ +10
  var PAD={t:30,l:52,b:48,r:28};
  var W=PAD.l+(N-1)*CELL+PAD.r;
  var H=PAD.t+(N-1)*CELL+PAD.b;
  var svg=document.getElementById('board');
  var gGrid=document.getElementById('gGrid');
  var gPieces=document.getElementById('gPieces');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);

  var board={}, cur=1, moves=0, over=false;
  var DIRS=[[1,0],[0,1],[1,1],[1,-1]];

  function el(tag,attrs){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs)e.setAttribute(k,attrs[k]);
    return e;
  }
  // 数学坐标 (x,y) -> 屏幕像素（原点在棋盘中心）
  function toScreen(x,y){
    return [PAD.l+(x+OFF)*CELL, PAD.t+(OFF-y)*CELL];
  }

  function buildBoard(){
    // 网格线（坐标轴位置的线换成粗黑轴线）
    for(var i=0;i<N;i++){
      if(i===OFF)continue;
      var gx=PAD.l+i*CELL;
      gGrid.appendChild(el('line',{class:'gl',x1:gx,y1:PAD.t,x2:gx,y2:PAD.t+(N-1)*CELL}));
      var gy=PAD.t+i*CELL;
      gGrid.appendChild(el('line',{class:'gl',x1:PAD.l,y1:gy,x2:PAD.l+(N-1)*CELL,y2:gy}));
    }
    // 坐标轴：x 轴(y=0)与 y 轴(x=0)，带箭头
    var ax=PAD.l+OFF*CELL, ay=PAD.t+OFF*CELL;
    gGrid.appendChild(el('line',{class:'ax',x1:PAD.l,y1:ay,x2:PAD.l+(N-1)*CELL,y2:ay,'marker-end':'url(#arrow)'}));
    gGrid.appendChild(el('line',{class:'ax',x1:ax,y1:PAD.t+(N-1)*CELL,x2:ax,y2:PAD.t,'marker-end':'url(#arrow)'}));
    // 坐标刻度 -10 ~ +10（不标 0）
    for(var j=0;j<N;j++){
      var v=j-OFF;
      if(v!==0){
        var tx=el('text',{class:'lab',x:PAD.l+j*CELL,y:ay+24,'text-anchor':'middle'});
        tx.textContent=v;gGrid.appendChild(tx);
        var ty=el('text',{class:'lab',x:ax-16,y:PAD.t+j*CELL+5,'text-anchor':'end'});
        ty.textContent=OFF-j;gGrid.appendChild(ty);
      }
    }
    // 原点与轴名
    var o=el('text',{class:'lab',x:ax+6,y:ay+20});o.textContent='O';gGrid.appendChild(o);
    var xl=el('text',{class:'lab axname',x:PAD.l+(N-1)*CELL+18,y:ay+5});xl.textContent='x';gGrid.appendChild(xl);
    var yl=el('text',{class:'lab axname',x:ax-22,y:PAD.t-8});yl.textContent='y';gGrid.appendChild(yl);
  }

  function place(x,y){
    board[x+','+y]=cur;
    moves++;
    var c=toScreen(x,y);
    var pc=el('circle',{cx:c[0],cy:c[1],r:CELL*0.42,class:cur===1?'pc black':'pc white'});
    gPieces.appendChild(pc);
    if(cur===1){
      // 黑子加一点高光，更有质感
      gPieces.appendChild(el('circle',{cx:c[0]-CELL*0.13,cy:c[1]-CELL*0.16,r:CELL*0.11,fill:'rgba(255,255,255,.55)'}));
    }
    if(checkWin(x,y,cur)){
      over=true;
      showResults(cur);
      return;
    }
    if(moves===N*N){
      over=true;
      showResults(0);
      return;
    }
    cur=cur===1?2:1;
    updateMsg();
  }

  function countDir(x,y,p,dx,dy){
    var c=0,nx=x+dx,ny=y+dy;
    while(nx>=-OFF&&nx<=OFF&&ny>=-OFF&&ny<=OFF&&board[nx+','+ny]===p){c++;nx+=dx;ny+=dy;}
    return c;
  }
  function checkWin(x,y,p){
    for(var k=0;k<DIRS.length;k++){
      var dx=DIRS[k][0],dy=DIRS[k][1];
      if(1+countDir(x,y,p,dx,dy)+countDir(x,y,p,-dx,-dy)>=4){
        // 圈出整段获胜棋子
        var x1=x,y1=y,x2=x,y2=y;
        while(x1-dx>=-OFF&&x1-dx<=OFF&&y1-dy>=-OFF&&y1-dy<=OFF&&board[(x1-dx)+','+(y1-dy)]===p){x1-=dx;y1-=dy;}
        while(x2+dx>=-OFF&&x2+dx<=OFF&&y2+dy>=-OFF&&y2+dy<=OFF&&board[(x2+dx)+','+(y2+dy)]===p){x2+=dx;y2+=dy;}
        for(var cx=x1,cy=y1;;cx+=dx,cy+=dy){
          var c=toScreen(cx,cy);
          gPieces.appendChild(el('circle',{cx:c[0],cy:c[1],r:CELL*0.5,class:'ring'}));
          if(cx===x2&&cy===y2)break;
        }
        return true;
      }
    }
    return false;
  }

  function updateMsg(){
    var t=document.getElementById('turnMsg');
    t.innerHTML='<span class="dot '+(cur===1?'b':'w')+'"></span>当前：'+(cur===1?'黑方':'白方')+'落子';
  }

  function showMsg(t,isErr){
    var m=document.getElementById('msg');
    m.textContent=t;
    m.style.color=isErr?'#d33a3f':'#15803d';
  }

  // 解析坐标输入 "(x,y)"：括号、逗号不限半角或全角
  function parseCoord(s){
    s=s.trim();
    var inner=null;
    if(s.length>=2){
      var a=s.charAt(0), b=s.charAt(s.length-1);
      if((a==='('&&b===')')||(a==='（'&&b==='）'))inner=s.slice(1,-1);
    }
    if(inner===null)return {err:'格式'};
    var parts=inner.split(/[,，]/);
    if(parts.length!==2)return {err:'格式'};
    var xs=parts[0].trim(), ys=parts[1].trim();
    if(xs===''||ys==='')return {err:'格式'};
    var x=Number(xs), y=Number(ys);
    if(!Number.isInteger(x)||!Number.isInteger(y))return {err:'整数'};
    if(x<-OFF||x>OFF||y<-OFF||y>OFF)return {err:'范围'};
    return {x:x,y:y};
  }

  function put(){
    if(over){
      showMsg('棋局已结束，请点击“重新开始”。',true);
      return;
    }
    var r=parseCoord(document.getElementById('coord').value);
    if(r.err==='格式'){
      showMsg('判定为“假”：请按 (x,y) 格式输入，例如 (3,-5)，括号与逗号可用半角或全角。',true);
      return;
    }
    if(r.err==='整数'){
      showMsg('判定为“假”：x、y 必须是整数。',true);
      return;
    }
    if(r.err==='范围'){
      showMsg('判定为“假”：x、y 需在 -10 到 10 之间。',true);
      return;
    }
    if(board[r.x+','+r.y]){showMsg('该位置已有棋子。',true);return;}
    var colorName=cur===1?'黑':'白';
    place(r.x,r.y);
    showMsg('判定为“真”：已在 ('+r.x+', '+r.y+') 落'+colorName+'子。');
    document.getElementById('coord').value='';
  }

  function reset(){
    board={};
    cur=1;moves=0;over=false;
    gPieces.innerHTML='';
    document.getElementById('coord').value='';
    showMsg('');
    updateMsg();
  }

  // ---- 结算界面（仿 osu! lazer ResultsScreen）----
  function burst(){
    var host=document.getElementById('rsParticles');
    host.innerHTML='';
    var colors=['#ff5d5d','#ffb84d','#ffd84d','#6ee36e','#5db8ff','#a07dff','#ff7df0'];
    for(var i=0;i<50;i++){
      var s=document.createElement('span');
      s.className='pr';
      var size=5+Math.random()*9;
      var ang=Math.random()*Math.PI*2;
      var dist=140+Math.random()*280;
      var dur=0.9+Math.random()*1.2;
      s.style.cssText='width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';animation-duration:'+dur+'s;';
      s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
      s.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
      host.appendChild(s);
    }
    // 冲击波圆环
    var ring=document.createElement('div');
    ring.className='rs-ring';
    document.body.appendChild(ring);
    setTimeout(function(){ring.remove();},850);
  }

  function showResults(w){
    var R=document.getElementById('results');
    var panel=R.querySelector('.rs-panel');
    var tag=document.getElementById('rsTag');
    var badge=document.getElementById('rsBadge');
    var dot=document.getElementById('rsDot');
    var txt=document.getElementById('rsTxt');
    var title=document.getElementById('rsTitle');
    var btns=document.getElementById('rsBtns');
    if(w===0){
      badge.textContent='平';
      badge.className='rs-badge tie';
      dot.className='rs-dot tie';
      txt.textContent='平局';
    }else{
      var isBlack=w===1;
      badge.textContent='胜';
      badge.className='rs-badge '+(isBlack?'b':'w');
      dot.className='rs-dot '+(isBlack?'b':'w');
      txt.textContent=(isBlack?'黑棋':'白棋')+' 胜利';
    }
    document.getElementById('turnMsg').innerHTML='对局已结束';
    // 重置动画状态并重新播放
    [panel,tag,badge,title,btns].forEach(function(e){e.classList.remove('in');});
    R.classList.remove('show');
    void R.offsetWidth;
    R.classList.add('show');
    void panel.offsetWidth;
    panel.classList.add('in');
    setTimeout(function(){tag.classList.add('in');},130);
    setTimeout(function(){badge.classList.add('in');},320);
    setTimeout(function(){title.classList.add('in');},500);
    setTimeout(function(){btns.classList.add('in');},900);
    setTimeout(burst,420);
  }

  function hideResults(){
    document.getElementById('results').classList.remove('show');
  }

  document.getElementById('btnPut').addEventListener('click',put);
  document.getElementById('btnReset').addEventListener('click',reset);
  document.getElementById('btnRetry').addEventListener('click',function(){hideResults();reset();});
  document.getElementById('btnBack').addEventListener('click',hideResults);

  buildBoard();
  reset();
})();
</script>
</body>
</html>
